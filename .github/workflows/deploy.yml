name: Deploy to GitHub Pages

# Builds the site with the GitHub Pages preset (subpath base + noindex) and
# publishes it to GitHub Pages. The preview at
# https://niranjan-gopal.github.io/onlinesoundmeterfree.com/ is intentionally
# NOT indexable (noindex meta + robots Disallow) so it never competes with the
# real domain for search rankings.
#
# When the real domain is live, you can delete this workflow (or keep it and
# just point DNS) — production builds use `npm run build` (base '/', indexable).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pages preset — subpath base + noindex)
        run: npm run build:ghpages
        env:
          DEPLOY_ENV: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
